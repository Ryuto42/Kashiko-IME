[package]
name = "kashiko-im"
version = "0.1.0"
edition.workspace = true
description = "Japanese IME engine and JSON-RPC server for the macOS frontend"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["japanese", "ime", "input-method"]
categories = ["text-processing", "internationalization"]

[lib]
name = "kashiko_im"
path = "src/lib.rs"

# stdio JSON-RPC engine server for the macOS (Swift/InputMethodKit) frontend
[[bin]]
name = "kashiko-imserver"
path = "src/bin/kashiko-imserver.rs"

[dependencies]
# Core engine
kashiko-engine.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Configuration
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories = "6"

# Error handling
anyhow.workspace = true

[dev-dependencies]
tokio-test = "0.4"
tempfile.workspace = true

[features]
default = []
