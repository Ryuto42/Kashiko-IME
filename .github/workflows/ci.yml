name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Some engine tests load the conversion model when it is available.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('crates/kashiko-engine/models.toml') }}
      - name: Rust tests
        run: cargo test --workspace
      - name: Swift tests
        run: swift test --package-path macos
