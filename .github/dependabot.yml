version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
        # Each llama.cpp upgrade changes the API and has to be measured on its own.
        exclude-patterns: ["llama-cpp-*"]
    ignore:
      # The system dictionary (dict.bin) is built with this version's format.
      - dependency-name: yada
        update-types: [version-update:semver-major, version-update:semver-minor]
      # 1.x is a rewrite with a much heavier dependency tree; 0.4 covers our use.
      - dependency-name: hf-hub
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
