[workspace]
members = ["crates/kashiko-engine", "crates/kashiko-im", "crates/kashiko-tools"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
authors = ["Ryuto42", "togatoga"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ryuto42/Kashiko-IME"
homepage = "https://github.com/Ryuto42/Kashiko-IME"

[workspace.dependencies]
# Shared across all 3 crates
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared across 2 crates
serde_json = "1"
toml = "1"
thiserror = "2"

# Internal crates
kashiko-engine = { path = "crates/kashiko-engine" }
kashiko-im = { path = "crates/kashiko-im" }

# Dev dependencies shared
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
